
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepscara Enterprise | Content Architecture System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-surface: #12151c;
            --bg-card: #1a1e26;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.1);
            --border-color: #2d333d;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            letter-spacing: -0.015em;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .app-header {
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .pro-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 6px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-item.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .pro-input {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .heading-xl {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.1;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-accent {
            background: var(--accent-soft);
            color: var(--accent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @media print {
            @page { size: A4; margin: 15mm; }
            .no-print { display: none !important; }
            body { background: #ffffff !important; color: #000000 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            #root { padding: 0 !important; }
            main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .pro-card { background: #ffffff !important; border: 1px solid #e2e8f0 !important; box-shadow: none !important; border-radius: 4px !important; break-inside: avoid; margin-bottom: 20px !important; color: #000000 !important; }
            .text-white, .text-slate-200, .text-slate-300, .text-slate-400, .text-slate-500 { color: #000000 !important; }
            .heading-xl { color: #000000 !important; font-size: 24pt !important; margin-bottom: 10pt !important; }
            .print-only { display: block !important; }
            img { max-width: 100% !important; display: block !important; border: 1px solid #e2e8f0 !important; }
            .printable-report-section { display: block !important; width: 100% !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
